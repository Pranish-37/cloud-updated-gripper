# data_collection.yaml
# Session-level hyperparameters for teleop data collection.
# Edit this file before starting a collection session.
# All parameters can be overridden on the command line:
#   ros2 launch cloudgripper_ros2 data_collection.launch.py total_episodes:=50
#
# NOTE: The /**  wildcard makes every key available to all nodes via --params-file.

/**:
  ros__parameters:

    # ---------------------------------------------------------------------------
    # Dataset
    # ---------------------------------------------------------------------------
    dataset_root: "/workspace/data/donut_hanging_Pranish"   # absolute path on disk
    dataset_repo_id: "CloudGripper/donut_hanging_Pranish"                           # HuggingFace-style repo id
    total_episodes: 50                                                    # stop after this many episodes
    task: "donut_hanging_Pranish"                                                   # task description string (optional)
    push_to_hub: false                                                     # set true to upload to HuggingFace after collection

    # ---------------------------------------------------------------------------
    # Recording
    # ---------------------------------------------------------------------------
    fps: 15.0                # recording frame rate (must match obs_aggregator publish_rate)
    dof_mode: 3             # 3 = 3-DoF (ee_xyz + gripper), 6 = 6-DoF (ee_xyz + rpy + gripper)
    image_height: 480
    image_width: 640
    image_writer_threads: 4

    # ---------------------------------------------------------------------------
    # Camera — realsense2_camera standard parameter set
    # ---------------------------------------------------------------------------
    serial_no: "843112070951"

    # Stream geometry (realsense2_camera v4.x — profile string replaces
    # deprecated color_width / color_height / color_fps).
    enable_color:  true
    enable_depth:  false
    enable_infra1: false
    enable_infra2: false
    rgb_camera.color_profile: "640x480x15" # 15 fps is recommended for data collection
    rgb_camera.color_format: "RGB8"
    realsense_node_name: "camera/camera"   # ae_awb_controller → /camera/camera/set_parameters

    robot_ip: "192.168.0.244"
    servo_mode: true                # xarm_driver: low-latency teleop streaming
    robot_publish_rate: 50.0        # xarm_driver state Hz (separate from obs publish_rate)

    # Auto-exposure / auto-white-balance
    # At startup both are enabled so the camera can converge.
    # After convergence call:  ros2 service call /camera/lock_exposure std_srvs/srv/Trigger
    # The ae_awb_controller_node then snapshots current values and disables both.
    color_auto_exposure:      true
    color_auto_white_balance: true

    # Manual override values — applied when the auto flags above are false.
    # Leave at -1 to let realsense use its last auto-converged value after locking.
    # Typical converged values for indoor lab lighting:
    #   exposure ~166 µs,  gain ~64,  white_balance ~4600 K
    color_exposure:      -1    # µs;  valid range depends on fps (e.g. 1–10000 at 15 fps)
    color_gain:          -1    # raw; valid range 16–248
    color_white_balance: -1    # K;   valid range ~2800–6500

    # Teleop / safety: config/teleop.yaml + config/safety.yaml (loaded by launch).

    # ---------------------------------------------------------------------------
    # Obs aggregator
    # ---------------------------------------------------------------------------
    publish_rate: 15.0              # ObsFrame Hz — keep in sync with fps above
    state_buffer_sec: 0.5           # robot-state history for stamp matching to image, in seconds
    # Warn when |ee_pose.stamp - joint_states.stamp| exceeds this (ms).
    state_stamp_mismatch_warn_ms: 5.0
    # Warn when best |t_image - t_ee| after stamp match exceeds this (ms).
    state_image_match_warn_ms: 50.0
